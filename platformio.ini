[platformio]
default_envs = tracker

; ====== Firmware principal (tracker) ======
[env:tracker]
platform = espressif32
board = esp32s3usbotg
framework = arduino

monitor_speed = 115200
upload_port = COM8

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

; ====== Utilidad: AT Passthrough (módem) ======
[env:at_passthrough]
platform = espressif32
board = esp32s3usbotg
framework = arduino

monitor_speed = 115200
upload_port = COM8

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

; Este env compila desde esta carpeta en vez de /src
src_dir = tools/at_passthrough/src