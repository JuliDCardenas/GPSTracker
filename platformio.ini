[platformio]
default_envs = tracker

[env]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200
upload_port = COM8

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

lib_deps =
  https://github.com/lewisxhe/TinyGSM-fork.git
  vshymanskyy/StreamDebugger@^1.0.1
  https://github.com/lewisxhe/TinyGSM-fork.git
  vshymanskyy/StreamDebugger@^1.0.1
  knolleary/PubSubClient@^2.8

; ====== Firmware principal (tracker) ======
[env:tracker]
build_src_filter =
  +<*>
  -<at_passthrough.cpp>

; ====== Utilidad: AT Passthrough (módem) ======
[env:at_passthrough]
build_src_filter =
  +<*>
  -<tracker.cpp>